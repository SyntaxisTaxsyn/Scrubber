<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scrubber Project Editor</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }

      #canvas {
        position: relative;
        width: 800px;
        height: 500px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
        /*background-color: #f9f9f9;*/
      }

      #object {
        position: absolute;
        background-image: url('Images/gupxCropped.png'); /* Update with the actual file path */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        transform-origin: center;
        touch-action: none;
      }

      #controls,
      #fields {
        margin-top: 10px;
      }

      button {
        margin-right: 10px;
        padding: 6px 12px;
      }

      input[type='range'] {
        width: 300px;
        vertical-align: middle;
      }

      input[type='number'] {
        width: 60px;
        margin-right: 10px;
      }

      label {
        margin-right: 5px;
      }

      #timelineWrapper {
        position: relative;
        display: inline-block;
      }

      #markerTrack {
        position: absolute;
        top: 50%;
        left: 0;
        height: 8px;
        width: 300px;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .marker {
        position: absolute;
        top: 0;
        width: 2px;
        height: 100%;
        background-color: blue;
      }

      #keyframeTable {
        margin-top: 20px;
        border-collapse: collapse;
        width: 100%;
        max-width: 600px;
      }

      #keyframeTable th,
      #keyframeTable td {
        border: 1px solid #ccc;
        padding: 6px 10px;
        text-align: center;
      }

      #keyframeTable tr:hover {
        background-color: #f0f8ff;
        cursor: pointer;
      }

      #imagePanel {
        position: absolute;
        right: 20px;
        top: 60px;
        width: 240px;
        background: #f8f8f8;
        border: 1px solid #ccc;
        padding: 12px;
      }

      #imageList {
        list-style: none;
        padding: 0;
        margin: 0 0 10px 0;
      }

      #backgroundPanel {
        position: absolute;
        right: 280px;
        top: 60px;
        width: 240px;
        background: #f8f8f8;
        border: 1px solid #ccc;
        padding: 12px;
      }

      #backgroundList {
        list-style: none;
        padding: 0;
        margin: 0 0 10px 0;
      }

      .interaction-hint {
        font-size: 24px;
        animation: pulse 1s infinite;
        color: red;
        text-shadow: 0 0 5px rgba(255, 0, 0, 0.7);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.5;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <h2>Scrubber Project Editor</h2>

    <label>
      Project Name:
      <input
        type="text"
        id="projectName"
        value="My Scrubber Project"
        style="margin-bottom: 10px; width: 220px"

        <input type="range" id="timeline" min="0" max="200" value="0" />
        <div id="markerTrack"></div>
      </div>
      <button id="addKeyframe">Add Keyframe</button>
      <button id="togglePlay">Play</button>
      <button id="changeImageBtn">Change Image</button>

      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <button id="increaseTimeBtn">+100</button>
      <button id="decreaseTimeBtn">-100</button>
      <input type="file" id="imageInput" accept="image/*" style="display: none" />
      <input type="file" id="loadInput" accept=".json" style="display: none" />
      <button onclick="addBackgroundKeyframe()">Add Background Keyframe</button>
      <button onclick="jumpToEnd()">&gt;|</button>
      <button onclick="jumpToStart()">|&lt;</button>
    </div>

    <div id="fields">
      <label>X: <input type="number" id="inputX" /></label>
      <label>Y: <input type="number" id="inputY" /></label>
      <label>Rotation: <input type="number" id="inputRotation" /></label>
      <label>Size: <input type="number" id="inputSize" /></label>
      <label>Opacity: <input type="number" id="inputOpacity" min="0" max="100" step="1" /></label>
      <label>Visible: <input type="checkbox" id="inputVisible" /></label>
      <label>Mirror: <input type="checkbox" id="inputMirror" /></label>
      <label
        >Image:
        <select id="imageSelect"></select>
      </label>
      <!-- New interaction fields -->
      <label
        >Interaction Required:
        <input type="checkbox" id="inputInteractionEnabled" />
      </label>

      <label
        >Interaction Type:
        <select id="inputInteractionType">
          <option value="click">Click</option>
          <!-- more interaction types later -->
        </select>
      </label>

      <label
        >Interaction Received:
        <input type="checkbox" id="inputInteractionReceived" />
      </label>
    </div>

    <div id="imagePanel">

      <ul id="imageList" style="list-style: none; padding: 0; margin: 0 0 10px 0"></ul>
      <input type="file" id="addImageInput" accept="image/*" style="display: none" />
      <button id="addImageBtn" style="width: 100%">Add Image</button>
    </div>

    <div id="backgroundPanel">

      <ul id="backgroundList" style="list-style: none; padding: 0; margin: 0 0 10px 0"></ul>
      <input type="file" id="addBackgroundInput" accept="image/*" style="display: none" />
      <button id="addBackgroundBtn" style="width: 100%">Add Background</button>

    <script>
      const showAllObjectsCheckbox = document.getElementById('showAllObjectsCheckbox');

      let pausedForInteraction = false;

      class AnimationObject {
        static allObjects = []; // keep track of all instances
        static canvas = null;
        static ctx = null;
        static initialized = false;

        constructor({
          id,
          name,
          x = 100,
          y = 100,
          size = 50,
          rotation = 0,
          opacity = 1,
          visible = true,
          mirror = false,
          imageId = 1,
          keyframes = [],
          images = [{ id: 1, label: 'Default', url: '' }],
          sounds = [], // NEW: [{ id, label, url }]
          interactionEnabled = false, // NEW: does this object require interaction?
          interactionType = 'click', // NEW: what kind of interaction ("click", later "hover", "keypress"...)
          interactionReceived = false, // NEW: has the interaction been received?
          InteractionFlagSeen = false,
        }) {
          this.id = id;
          this.name = name;
          this.x = x;
          this.y = y;
          this.size = size;
          this.rotation = rotation;
          this.opacity = opacity;
          this.visible = visible;
          this.mirror = mirror;
          this.imageId = imageId;
          this.keyframes = keyframes; // [{...}]
          this.images = images; // [{id, label, url}]
          this.sounds = sounds; // store original sound data
          this._audioElements = {}; // preload audio
          this.interactionEnabled = interactionEnabled;
          this.interactionType = interactionType;
          this.InteractionFlagSeen = InteractionFlagSeen;

          for (const sound of sounds) {
            if (sound.url) {
              const audio = new Audio(sound.url);
              audio.loop = !!sound.loop; // enable looping
              audio.volume =
                sound.volume !== undefined // set volume
                  ? Math.max(0, Math.min(1, sound.volume)) // clamp to [0, 1]
                  : 1.0;

              this._audioElements[sound.id] = audio;
            }
          }

          // Initialize canvas once
          if (!AnimationObject.initialized) {
            AnimationObject.createCanvas();
          }

          AnimationObject.allObjects.push(this);

          // For dragging
          this.isDragging = false;
          this.offsetX = 0;
          this.offsetY = 0;

          // Object interaction hint code
          this._hintEl = document.createElement('div');
          this._hintEl.className = 'interaction-hint';
          this._hintEl.innerText = '👆';
          this._hintEl.style.position = 'absolute';
          this._hintEl.style.pointerEvents = 'none';
          this._hintEl.style.display = 'none';

          AnimationObject.canvas.parentElement.appendChild(this._hintEl);

          // Register events
          this.registerEvents();
        }
        getState() {
          return {
            x: this.x,
            y: this.y,
            size: this.size,
            rotation: this.rotation,
            opacity: this.opacity,
            visible: this.visible,
            mirror: this.mirror,
            imageId: this.imageId,
            interactionEnabled: this.interactionEnabled,
            interactionType: this.interactionType,
            interactionReceived: this.interactionReceived,
            InteractionFlagSeen: this.InteractionFlagSeen,
          };
        }

        static createCanvas() {
          AnimationObject.canvas = document.getElementById('canvas');
          AnimationObject.ctx = AnimationObject.canvas.getContext('2d');
          AnimationObject.initialized = true;

          // Start render loop
          requestAnimationFrame(AnimationObject.renderAll);
        }

        registerEvents() {
          const canvas = AnimationObject.canvas;

          // Support both mouse and touch
          const getPos = (evt) => {
            if (evt.touches && evt.touches.length > 0) {
              const rect = canvas.getBoundingClientRect();
              return {
                x: evt.touches[0].clientX - rect.left,
                y: evt.touches[0].clientY - rect.top,
              };
            } else {
              const rect = canvas.getBoundingClientRect();
              return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top,
              };
            }
          };

          canvas.addEventListener('mousedown', (evt) => {
            const pos = getPos(evt);

            if (
              this.interactionEnabled &&
              this.interactionType === 'click' &&
              this.hitTest(pos.x, pos.y)
            ) {
              console.log(`Interaction triggered on object ${this.id} (${this.name})`);
              this.interactionReceived = true; // mark interaction received
              this.interactionEnabled = false; // disable further interaction until reset
              resumeTimeline();
            }

            if (this.hitTest(pos.x, pos.y)) {
              this.isDragging = true;
              this.offsetX = pos.x - this.x;
              this.offsetY = pos.y - this.y;
            }
          });

          canvas.addEventListener('mousemove', (evt) => {
            if (this.isDragging) {
              const pos = getPos(evt);
              this.x = pos.x - this.offsetX;
              this.y = pos.y - this.offsetY;
              applyState(this.getState());
            }
          });

          canvas.addEventListener('mouseup', () => {
            this.isDragging = false;
          });

          // Touch support
          canvas.addEventListener('touchstart', (evt) => {
            const pos = getPos(evt);
            if (this.hitTest(pos.x, pos.y)) {
              this.isDragging = true;
              this.offsetX = pos.x - this.x;
              this.offsetY = pos.y - this.y;
            }
          });

          canvas.addEventListener('touchmove', (evt) => {
            if (this.isDragging) {
              evt.preventDefault();
              const pos = getPos(evt);
              this.x = pos.x - this.offsetX;
              this.y = pos.y - this.offsetY;
              applyState(this.getState());
            }
          });

          canvas.addEventListener('touchend', () => {
            this.isDragging = false;
          });
        }

        hitTest(px, py) {
          return (
            px > this.x - this.size / 2 &&
            px < this.x + this.size / 2 &&
            py > this.y - this.size / 2 &&
            py < this.y + this.size / 2
          );
        }

        draw(ctx) {
          if (!this.visible) return;

          // Find the image for this object
          const imgData = this.images.find((i) => i.id === this.imageId) || this.images[0];
          if (!imgData || !imgData.url) return;

          // Create or reuse an Image object for drawing
          if (!this._imgElement) {
            this._imgElement = new window.Image();
            this._imgElement.src = imgData.url;
          }
          // If the image changed, update src
          if (this._imgElement.src !== imgData.url) {
            this._imgElement.src = imgData.url;
          }

          // Only draw if the image is loaded
          if (!this._imgElement.complete || !this._imgElement.naturalWidth) return;

          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.scale(this.mirror ? -1 : 1, 1);

          // --- Aspect ratio preserving draw (like background-size: contain) ---
          const size = this.size;
          const iw = this._imgElement.naturalWidth;
          const ih = this._imgElement.naturalHeight;
          let drawW = size,
            drawH = size;
          if (iw > ih) {
            drawH = size * (ih / iw);
          } else if (ih > iw) {
            drawW = size * (iw / ih);
          }
          ctx.drawImage(this._imgElement, -drawW / 2, -drawH / 2, drawW, drawH);

          ctx.restore();

          // --- Update CSS hint ---
          if (pausedForInteraction && this.interactionEnabled && !this.interactionReceived) {
            const rect = AnimationObject.canvas.getBoundingClientRect();
            const scrollX = window.scrollX || window.pageXOffset;
            const scrollY = window.scrollY || window.pageYOffset;
            const scaleX = rect.width / AnimationObject.canvas.width;
            const scaleY = rect.height / AnimationObject.canvas.height;

            // Function to transform local coords -> world coords
            const transformPoint = (px, py) => {
              const angle = (this.rotation * Math.PI) / 180;
              const cos = Math.cos(angle);
              const sin = Math.sin(angle);
              const mx = this.mirror ? -1 : 1;

              // Apply mirror, rotation, then translate
              const x = px * mx * cos - py * sin + this.x;
              const y = px * mx * sin + py * cos + this.y;
              return { x, y };
            };

            // Four corners of the drawn rect (local space)
            const halfW = drawW / 2;
            const halfH = drawH / 2;
            const corners = [
              transformPoint(-halfW, -halfH),
              transformPoint(halfW, -halfH),
              transformPoint(halfW, halfH),
              transformPoint(-halfW, halfH),
            ];

            // Bounding box in world space
            const minX = Math.min(...corners.map((c) => c.x));
            const maxX = Math.max(...corners.map((c) => c.x));
            const minY = Math.min(...corners.map((c) => c.y));
            const maxY = Math.max(...corners.map((c) => c.y));

            // Convert to DOM coords
            const domMinX = rect.left + minX * scaleX;
            const domMaxX = rect.left + maxX * scaleX;
            const domMinY = rect.top + minY * scaleY;
            const domMaxY = rect.top + maxY * scaleY;

            const domCenterX = (domMinX + domMaxX) / 2;
            const domTopY = domMinY;

            this._hintEl.style.display = 'block';
            this._hintEl.style.left = `${domCenterX - this._hintEl.offsetWidth / 2 + scrollX}px`;
            this._hintEl.style.top = `${domTopY - this._hintEl.offsetHeight - 8 + scrollY}px`; // 8px above
          } else {
            this._hintEl.style.display = 'none';
          }
        }

        static renderAll() {
          const ctx = AnimationObject.ctx;
          ctx.clearRect(0, 0, AnimationObject.canvas.width, AnimationObject.canvas.height);

          for (const obj of AnimationObject.allObjects) {
            obj.draw(ctx);
          }

          requestAnimationFrame(AnimationObject.renderAll);
        }

        playSoundById(id) {
          const audio = this._audioElements[id];
          if (audio) {
            audio.pause(); // avoid overlap
            audio.currentTime = 0;
            audio.play().catch((err) => console.warn('Audio play error:', err));
          } else {
            console.warn(`Sound with id ${id} not found`);
          }
        }

        stopSoundById(id) {
          const audio = this._audioElements[id];
          if (audio) {
            audio.pause(); // stop playback
            audio.currentTime = 0; // reset to start
          } else {
            console.warn(`Sound with id ${id} not found`);
          }
        }

        setSoundVolumeById(id, volume) {
          const audio = this._audioElements[id];
          if (audio) {
            audio.volume = Math.max(0, Math.min(1, volume)); // clamp to [0, 1]
          } else {
            console.warn(`Sound with id ${id} not found`);
          }
        }
      }

      // this is a comment
      // this is another comment
      // and one more

      const addKeyframeBtn = document.getElementById('addKeyframe');

      function renderObjectList() {
        const list = AnimationObject.allObjects;

        objectList.innerHTML = '';

        moveUpButton.disabled = selectedObject <= 0;
        moveDownButton.disabled = selectedObject < 0 || selectedObject >= list.length - 1;

        list.forEach((obj, idx) => {
          const li = document.createElement('li');
          li.textContent = obj.name;
          li.style.cursor = 'pointer';
          li.style.padding = '4px 8px';
          li.style.borderRadius = '4px';
          li.style.marginBottom = '4px';
          li.style.background = idx === selectedObject ? '#e0f0ff' : '';

          let clickTimer;

          li.addEventListener('click', () => {
            clickTimer = setTimeout(() => {
              selectedObject = idx;
              renderObjectList();
              renderImageSelect();
              renderImageList();
              renderMarkers();

      function interpolateObj(a, b, t, o) {
        const lerp = (x, y) => x + (y - x) * t;

        // This mechanism handles the 1 shot activation of the interaction flag per keyframe
        var interactionReqFlag = false;
        console.log(
          `[interaction check] obj=${o.id || '?'}, keyframe.t=${a.time}, ` +
            `kf.interactionEnabled=${a.interactionEnabled}, ` +
            `obj.InteractionFlagSeen=${o.InteractionFlagSeen}, ` +
            `obj.interactionEnabled=${o.interactionEnabled}`,
        );
        if (a.interactionEnabled && !o.InteractionFlagSeen) {
          interactionReqFlag = true;
          o.InteractionFlagSeen = true;
          o.interactionEnabled = true;
        }
        if (!a.interactionEnabled) {
          o.InteractionFlagSeen = false;
          interactionReqFlag = false;
          o.interactionEnabled = false;
          o.interactionReceived = false;
        }

        return {
          x: lerp(a.x, b.x),
          y: lerp(a.y, b.y),
          size: lerp(a.size, b.size),
          rotation: lerp(a.rotation, b.rotation),
          opacity: lerp(a.opacity, b.opacity),
          visible: a.visible,
          mirror: a.mirror,
          imageId: a.imageId, // step, not interpolated
          interactionEnabled: interactionReqFlag, // step, not interpolated
          interactionType: a.interactionType, // step, not interpolated
          interactionReceived: a.interactionReceived, // step, not interpolated
        };
      }

      function interpolate(a, b, t) {
        const lerp = (x, y) => x + (y - x) * t;

        return {
          x: lerp(a.x, b.x),
          y: lerp(a.y, b.y),
          size: lerp(a.size, b.size),
          rotation: lerp(a.rotation, b.rotation),
          opacity: lerp(a.opacity, b.opacity),
          visible: a.visible,
          mirror: a.mirror,
          imageId: a.imageId,
        };
      }

      function getStateAt(obj, time) {
        const kfs = obj.keyframes;
        if (kfs.length === 0) return { ...obj }; // return object itself if no keyframes

        if (time <= kfs[0].time) return kfs[0];
        if (time >= kfs[kfs.length - 1].time) return kfs[kfs.length - 1];

        for (let i = 0; i < kfs.length - 1; i++) {
          const a = kfs[i];
          const b = kfs[i + 1];
          if (time >= a.time && time <= b.time) {
            const progress = (time - a.time) / (b.time - a.time);
            if (a.interactionEnabled && !obj.InteractionFlagSeen) {
              a.InteractionFlagSeen = true;
            }
            return interpolateObj(a, b, progress, obj);
          }
        }

        return { ...obj };
      }

      function getBackgroundAt(time) {
        if (backgroundKeyframes.length === 0) return currentBackground;
        if (time <= backgroundKeyframes[0].time) return backgroundKeyframes[0];
        if (time >= backgroundKeyframes[backgroundKeyframes.length - 1].time)
          return backgroundKeyframes[backgroundKeyframes.length - 1];

        for (let i = 0; i < backgroundKeyframes.length - 1; i++) {
          const a = backgroundKeyframes[i];
          const b = backgroundKeyframes[i + 1];
          if (time >= a.time && time <= b.time) {
            const progress = (time - a.time) / (b.time - a.time);
            return interpolate(a, b, progress);
          }
        }
        return currentBackground;
      }

      function resumeTimeline() {
        pausedForInteraction = false;
        if (!playing) {

          playInterval = setInterval(() => {
            currentTime += 1;
            const maxTime = parseInt(timeline.max, 10);

            // ⏸ Check for interaction requirement
            const blockingObj = animationObjects.find(
              (obj) => obj.interactionEnabled && !obj.interactionReceived,
            );
            if (blockingObj) {
              pauseTimelineForInteraction(blockingObj);
              return; // stop advancing until resumed
            }

            if (currentTime > maxTime) {
              currentTime = maxTime;
              clearInterval(playInterval);
              playing = false;
              togglePlayBtn.textContent = 'Play';
            }
            timeline.value = currentTime;
            updateFromTimeline();
          }, 50);
        }

        const a = document.createElement('a');
        a.href = url;
        a.download = projectName.replace(/[\\/:*?"<>|]+/g, '_') + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 0);
      });

      loadBtn.addEventListener('click', () => {
        loadInput.click();
      });

      loadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (evt) {
          try {
            const data = JSON.parse(evt.target.result);
            projectNameInput.value = data.projectName || 'My Scrubber Project';
            objectImages = data.objectImages || [];
            keyframes.length = 0;
            (data.keyframes || []).forEach((kf) => keyframes.push(kf));
            Object.assign(currentState, data.currentState || {});
            // Restore backgrounds
            backgroundImages = data.backgroundImages || [{ id: 1, label: 'Default BG', url: '' }];
            backgroundKeyframes = data.backgroundKeyframes || [];
            currentBackground = data.currentBackground || { imageId: 1 };

            /// make sure array data for animationObjects is initialized
            animationObjects.length = 0;
            animationObjects.allObjects = [];
            AnimationObject.allObjects = [];

            // Restore animationObjects
            if (Array.isArray(data.animationObjects)) {
              data.animationObjects.forEach((objData) => {
                animationObjects.push(new AnimationObject(objData));
              });
              selectedObject = 0;
              // Optionally restore currentState from the first object
              if (animationObjects.length > 0) {
                Object.assign(currentState, animationObjects[0].getState());
              }
            }

            // Restore timeline max (default to 200 if missing)
            timeline.max = data.timelineMax || 100;
            if (currentTime > timeline.max) {
              currentTime = timeline.max;
              timeline.value = currentTime;
              updateFromTimeline();
            }

            // Update next IDs
            nextImageId =
              animationObjects[selectedObject].images.reduce(
                (max, img) => Math.max(max, img.id),
                0,
              ) + 1;
            nextBackgroundImageId =
              backgroundImages.reduce((max, img) => Math.max(max, img.id), 0) + 1;
            renderImageSelect();
            renderImageList();
            renderMarkers();
            renderKeyframeTable();
            renderBackgroundList();
            renderBackgroundKeyframeTable();
            applyState(currentState);
            applyBackground(currentBackground);
            renderObjectList();
          } catch (err) {
            alert('Failed to load project: ' + err.message);
          }
        };
        reader.readAsText(file);
      });

      const backgroundPanel = document.getElementById('backgroundPanel');
      const backgroundList = document.getElementById('backgroundList');
      const addBackgroundBtn = document.getElementById('addBackgroundBtn');
      const addBackgroundInput = document.getElementById('addBackgroundInput');

      function renderBackgroundList() {
        backgroundList.innerHTML = '';
        backgroundImages.forEach((bg) => {
          const li = document.createElement('li');
          li.style.display = 'flex';
          li.style.alignItems = 'center';
          li.style.marginBottom = '6px';
          li.innerHTML = `
          <img src="${bg.url}" style="width:36px;height:36px;object-fit:contain;border:1px solid #ccc;margin-right:8px;">
          <input type="text" value="${bg.label}" style="flex:1; margin-right:4px; min-width:0;">
          <button title="Remove" style="margin-left:2px;">🗑️</button>
        `;
          // Rename handler
          li.querySelector('input[type="text"]').addEventListener('change', (e) => {
            bg.label = e.target.value;
            renderBackgroundList();
            renderBackgroundKeyframeTable();
          });
          // Remove handler
          li.querySelector('button').onclick = () => {
            if (backgroundImages.length === 1) {
              alert('At least one background is required.');
              return;
            }
            // Remove all background keyframes using this imageId
            for (let i = backgroundKeyframes.length - 1; i >= 0; i--) {
              if (backgroundKeyframes[i].imageId === bg.id) backgroundKeyframes.splice(i, 1);
            }
            backgroundImages = backgroundImages.filter((i) => i.id !== bg.id);
            if (!backgroundImages.find((i) => i.id === currentBackground.imageId)) {
              currentBackground.imageId = backgroundImages[0].id;
            }
            renderBackgroundList();
            renderBackgroundKeyframeTable();
            applyBackground(currentBackground);
          };
          // Highlight if selected
          if (bg.id === currentBackground.imageId) {
            li.style.background = '#e0f0ff';
          }
          // Click thumbnail to select
          li.querySelector('img').onclick = () => {
            currentBackground.imageId = bg.id;
            applyBackground(currentBackground);
          };
          backgroundList.appendChild(li);
        });
      }

      // TODO: add drag-and-drop reordering of backgrounds

      addBackgroundBtn.onclick = () => addBackgroundInput.click();
      addBackgroundInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (evt) {
          const label =
            prompt(
              'Enter background label/description:',
              `Background ${backgroundImages.length + 1}`,
            ) || `Background ${backgroundImages.length + 1}`;
          backgroundImages.push({ id: nextBackgroundImageId++, label, url: evt.target.result });
          renderBackgroundList();
          renderBackgroundKeyframeTable();
        };
        reader.readAsDataURL(file);
      };

      renderBackgroundList();

      const backgroundDiv = document.getElementById('background');

      function applyBackground(state) {
        const bg = backgroundImages.find((i) => i.id === state.imageId) || backgroundImages[0];
        backgroundDiv.style.backgroundImage = bg.url ? `url('${bg.url}')` : '';
        backgroundDiv.style.backgroundSize = 'cover';
        backgroundDiv.style.backgroundPosition = 'center';
      }

      function addBackgroundKeyframe() {
        const time = parseFloat(timeline.value);
        backgroundKeyframes.push({ time, imageId: currentBackground.imageId });
        backgroundKeyframes.sort((a, b) => a.time - b.time);
        renderBackgroundKeyframeTable();
      }

      function jumpToEnd() {
        currentTime = parseInt(timeline.max, 10);
        timeline.value = currentTime;
        updateFromTimeline();
      }

      function jumpToStart() {
        currentTime = 0;
        timeline.value = currentTime;
        updateFromTimeline();
      }

      moveUpButton.addEventListener('click', () => {
        const list = AnimationObject.allObjects;

        if (selectedObject <= 0 || selectedObject >= list.length) return;

        const temp = list[selectedObject];
        list[selectedObject] = list[selectedObject - 1];
        list[selectedObject - 1] = temp;

        selectedObject -= 1;

        renderObjectList();
      });

      moveDownButton.addEventListener('click', () => {
        const list = AnimationObject.allObjects;

        if (selectedObject < 0 || selectedObject >= list.length - 1) return;

        const temp = list[selectedObject];
        list[selectedObject] = list[selectedObject + 1];
        list[selectedObject + 1] = temp;

        selectedObject += 1;

        renderObjectList();
      });
    </script>
  </body>
</html>
